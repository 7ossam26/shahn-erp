# Optional reviewed connection-provider installation overlay (Compose >=2.24.4).
# Fresh installation: TAWSEL_CONNECTION_MODE=setup-required in private/runtime.env.
# Bound installation: database. Issuer/session secrets remain separate.
# Deploy only in a separately authorized run; these files contain no secret values.
services:
  api:
    secrets: !override [runtime_dsn, oidc_client, oidc_admin, session_key, tawsel_approval, tawsel_encryption]
    environment:
      TAWSEL_CONFIG_FILE: ''
      TAWSEL_INSTALLATION_APPROVAL_FILE: /run/secrets/tawsel_approval
      TAWSEL_ENCRYPTION_KEYS_FILE: /run/secrets/tawsel_encryption
  worker:
    secrets: !override [runtime_dsn, oidc_client, oidc_admin, session_key, tawsel_approval, tawsel_encryption]
    environment:
      TAWSEL_CONFIG_FILE: ''
      TAWSEL_INSTALLATION_APPROVAL_FILE: /run/secrets/tawsel_approval
      TAWSEL_ENCRYPTION_KEYS_FILE: /run/secrets/tawsel_encryption
secrets:
  tawsel_approval: {file: ./private/tawsel-approval.json}
  tawsel_encryption: {file: ./private/tawsel-encryption.json}
