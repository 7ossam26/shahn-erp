name: shahn-p01-dev
services:
  db:
    image: postgres:18.6-bookworm@sha256:3725f4e2499eef5134592b3b4ab79a543ed7f8e533b05b5b637af926630f6650
    environment:
      POSTGRES_DB: shahn_p01_dev
      POSTGRES_USER: ${DEV_DB_USER:?Run npm run dev:setup}
      POSTGRES_PASSWORD: ${DEV_DB_PASSWORD:?Run npm run dev:setup}
      TZ: UTC
    ports:
      - '127.0.0.1:${DEV_DB_PORT:-15418}:5432'
    volumes:
      - p01_dev_data:/var/lib/postgresql
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U $$POSTGRES_USER -d shahn_p01_dev']
      interval: 2s
      timeout: 2s
      retries: 30
volumes:
  p01_dev_data:
